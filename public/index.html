/* 🔹 Toast styling */
#toast {
  visibility: hidden;
  min-width: 260px;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 8px;
  padding: 10px 20px;
  position: fixed;
  z-index: 9999;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  font-size: 15px;
  opacity: 0;
  transition: opacity 0.4s, visibility 0.4s;
}

#toast.show {
  visibility: visible;
  opacity: 1;
}
</style>
<script>

window.addEventListener("DOMContentLoaded", () => {
  // Form is now simplified - just username and password
});

// 🔹 Toast utility
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = "show";
  setTimeout(() => (toast.className = toast.className.replace("show", "")), 3000);
}
</script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
  const inputs = document.querySelectorAll(".line-input");

  inputs.forEach((input, index) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();

        if (index < inputs.length - 1) {
          inputs[index + 1].focus();
        } else {
          // Trigger the same login flow as the Login button
          document.getElementById('okDTNB').click();
        }
      }
    });
  });
});
</script>

<script>
let isSubmitting = false;

document.getElementById('okDTNB').addEventListener('click', async function (event) {
  event.preventDefault();

  if (isSubmitting) return;
  isSubmitting = true;

  const username = document.getElementById('username-login').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username) {
    showToast('❌ Please enter a username.');
    isSubmitting = false;
    return;
  }

  try {
    const response = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.text();

    if (response.ok) {
      // Successful login - server rendered database-selection page
      document.open();
      document.write(data);
      document.close();

   
   localStorage.setItem('selectedusername', username);

    } else {
      // Parse error response
      try {
        const errorData = JSON.parse(data);
        showToast('❌ ' + errorData.message);
      } catch {
        showToast('❌ Login failed. Please try again.');
      }
      isSubmitting = false;
    }
  } catch (error) {
    console.error('Login error:', error);
    showToast('❌ Connection error. Please try again.');
    isSubmitting = false;
  }
});
</script>
