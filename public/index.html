/* 🔹 Toast styling */
#toast {
  visibility: hidden;
  min-width: 260px;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 8px;
  padding: 10px 20px;
  position: fixed;
  z-index: 9999;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  font-size: 15px;
  opacity: 0;
  transition: opacity 0.4s, visibility 0.4s;
}

#toast.show {
  visibility: visible;
  opacity: 1;
}
</style>
<script>
let userValidated = false;
let typingTimer;
const typingDelay = 500; // ms
let lastHoverToastTime = 0; // prevent repeated hover toasts too quickly

window.addEventListener("DOMContentLoaded", () => {
  const orgInput = document.getElementById("organization-name");
  const usernameInput = document.getElementById("username-login");
  const passwordInput = document.getElementById("password");

  // 🔹 Disable organization input at start
  orgInput.disabled = true;
  orgInput.style.cursor = "not-allowed";

  // 🔹 Show toast on hover when input is disabled
  orgInput.addEventListener("mouseenter", () => {
    if (orgInput.disabled) {
      const now = Date.now();
      // show toast only if 2.5s passed since last hover toast
      if (now - lastHoverToastTime > 2500) {
        showToast("⚠️ This field will open once you enter your username and password.");
        lastHoverToastTime = now;
      }
    }
  });

  // 🔹 Auto-check credentials when typing stops
  usernameInput.addEventListener("input", handleTyping);
  passwordInput.addEventListener("input", handleTyping);
});

// 🔹 Debounce typing to prevent excessive calls
function handleTyping() {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    const username = document.getElementById("username-login").value.trim();
    const password = document.getElementById("password").value.trim();

    const orgInput = document.getElementById("organization-name");

    // 🔹 If username cleared, reset organization field
    if (!username) {
      userValidated = false;
      orgInput.disabled = true;
      orgInput.style.cursor = "not-allowed";
      return;
    }

    // Otherwise, validate credentials
    validateLoginBeforeOrg(username, password);
  }, typingDelay);
}

// 🔹 Validate credentials automatically
async function validateLoginBeforeOrg(username, password) {
  // Skip if already validated
  if (userValidated) return;

  try {
    const res = await fetch("/api/prevalidate-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.valid) {
      userValidated = true;
      enableOrganizationField();
    }
    else 
    {
       
        disableOrganizationField();
    }
  } catch (err) {
    console.error("Validation error:", err);
     showToast("❌ Unable to connect to server.", "error");
  }
}

// 🔹 Enable organization input
function enableOrganizationField() {
  const orgInput = document.getElementById("organization-name");
  orgInput.disabled = false;
  orgInput.style.cursor = "text";
  showToast("✅ Validation successful! You can now choose an organization.");
}
// 🔹 Disable organization input
function disableOrganizationField() {
  const orgInput = document.getElementById("organization-name");
  orgInput.disabled = true;
  orgInput.style.cursor = "text";
  showToast("❌ Invalid username or password.Please try again");
}
// 🔹 Toast utility
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = "show";
  setTimeout(() => (toast.className = toast.className.replace("show", "")), 3000);
}
</script>

// Add drag-and-drop functionality
const movableDiv1 = document.getElementById('movableDivfiscalyear');

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

movableDiv1.addEventListener('mousedown', (e) => {
  isDragging = true;
  offsetX = e.clientX - movableDiv1.offsetLeft;
  offsetY = e.clientY - movableDiv1.offsetTop;
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
});

function onMouseMove(e) {
  if (isDragging) {
    movableDiv1.style.left = `${e.clientX - offsetX}px`;
    movableDiv1.style.top = `${e.clientY - offsetY}px`;
  }
}

function onMouseUp() {
  isDragging = false;
  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('mouseup', onMouseUp);
}

document.getElementById('cancelButton').addEventListener('click', function(){
  document.getElementById('movableDivfiscalyear').style.display = 'none';
})

</script>

<script>
 


    const inputElement = document.querySelector('.options');
    const movableDiv = document.getElementById('movableDiv81');
    // Show the movable div when the input is clicked
    inputElement.addEventListener('click', () => {
    if (movableDiv.style.display === 'none' || movableDiv.style.display === '') {
        // Show the div
        movableDiv.style.display = 'block';
        movableDiv.style.left = `${inputElement.offsetLeft}px`;
        movableDiv.style.top = `${inputElement.offsetTop + inputElement.offsetHeight}px`;
    } else {
        // Hide the div
        movableDiv.style.display = 'none';
    }
});

    // Make the div draggable
    movableDiv.onmousedown = function (event) {
        let shiftX = event.clientX - movableDiv.getBoundingClientRect().left;
        let shiftY = event.clientY - movableDiv.getBoundingClientRect().top;

        function moveAt(pageX, pageY) {
            movableDiv.style.left = pageX - shiftX + 'px';
            movableDiv.style.top = pageY - shiftY + 'px';
        }
        function onMouseMove(event) {
            moveAt(event.pageX, event.pageY);
        }
        document.addEventListener('mousemove', onMouseMove);
        movableDiv.onmouseup = function () {
            document.removeEventListener('mousemove', onMouseMove);
            movableDiv.onmouseup = null;
        };
    };
    movableDiv.ondragstart = function () {
        return false;
    };
</script>
<script>
    // Function to display the custom alert modal
function showCustomAlert(message) {
    const alertModal = document.getElementById('customAlert');
    const alertMessage = document.getElementById('alertMessage');
    const closeAlert = document.getElementById('closeAlert');
    const okButton = document.getElementById('alertOkButton');

    // Set the message text
    alertMessage.textContent = message;

    // Show the modal
    alertModal.style.display = 'flex';

    // Close modal when clicking the close button
    closeAlert.onclick = () => {
        alertModal.style.display = 'none';
    };

    // Close modal when clicking the OK button
    okButton.onclick = () => {
        alertModal.style.display = 'none';
    };

    // Close modal when clicking outside the modal content
    window.onclick = (event) => {
        if (event.target === alertModal) {
            alertModal.style.display = 'none';
        }
    };
}

</script>
