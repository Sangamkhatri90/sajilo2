<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/docClass.css">
  <title>Document Class Selection</title>
</head>
<body>
<div id="lajita" class="selection-container">
  <div class="welcome-header">
    <h1>Select Document Class</h1>
    <p>Please select a document class to continue.</p>
  </div>

<input type="text" id="docClassForLogin" oninput="filterDocClassesForLogin()" placeholder="Search for DocClass...">

<div class="table-container">
<table id="docClassesTable">
  <thead>
    <tr>
      <th>Document Class</th>
      <th>Alias</th>
    </tr>
  </thead>
  <tbody id="docClassesTableBody">
    <!-- Rows will be inserted dynamically -->
  </tbody>
</table>
</div>

<div id="selectionButtons" class="button-row">
  <button type="button" class="buttons" id="okButton" onclick="selectRow()">OK</button>
  <button type="button" class="button" id="cancelButton" onclick="cancelSelection()">Cancel</button>
</div>
</div>

<script src="js/fetchdocclass.js"></script>

<script src="/js/inputBehavior.js"></script>
</body>
</html>
