        document.addEventListener('DOMContentLoaded', () => {

                addRowToTable(formData.name, formData.fiscalStart, formData.fiscalEnd);
                localStorage.removeItem('formData'); // Clear after adding to the table
            }
        });

        // Function to add a row to the table
        window.addRowToTable = function (name, fiscalStart, fiscalEnd) {
            const tableBody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
            const newRow = tableBody.insertRow();

            const nameCell = newRow.insertCell(0);
            const fiscalStartCell = newRow.insertCell(1);
            const fiscalEndCell = newRow.insertCell(2);

            nameCell.textContent = name;
            fiscalStartCell.textContent = fiscalStart;
            fiscalEndCell.textContent = fiscalEnd;
        };
    </script>

// Add drag-and-drop functionality
const movableDiv1 = document.getElementById('movableDivfiscalyear');

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

movableDiv1.addEventListener('mousedown', (e) => {
  isDragging = true;
  offsetX = e.clientX - movableDiv1.offsetLeft;
  offsetY = e.clientY - movableDiv1.offsetTop;
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
});

function onMouseMove(e) {
  if (isDragging) {
    movableDiv1.style.left = `${e.clientX - offsetX}px`;
    movableDiv1.style.top = `${e.clientY - offsetY}px`;
  }
}

function onMouseUp() {
  isDragging = false;
  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('mouseup', onMouseUp);
}

document.getElementById('cancelButton').addEventListener('click', function(){
  document.getElementById('movableDivfiscalyear').style.display = 'none';
})

</script>

<script>
 


    const inputElement = document.querySelector('.options');
    const movableDiv = document.getElementById('movableDiv81');
    // Show the movable div when the input is clicked
    inputElement.addEventListener('click', () => {
    if (movableDiv.style.display === 'none' || movableDiv.style.display === '') {
        // Show the div
        movableDiv.style.display = 'block';
        movableDiv.style.left = `${inputElement.offsetLeft}px`;
        movableDiv.style.top = `${inputElement.offsetTop + inputElement.offsetHeight}px`;
    } else {
        // Hide the div
        movableDiv.style.display = 'none';
    }
});

    // Make the div draggable
    movableDiv.onmousedown = function (event) {
        let shiftX = event.clientX - movableDiv.getBoundingClientRect().left;
        let shiftY = event.clientY - movableDiv.getBoundingClientRect().top;

        function moveAt(pageX, pageY) {
            movableDiv.style.left = pageX - shiftX + 'px';
            movableDiv.style.top = pageY - shiftY + 'px';
        }
        function onMouseMove(event) {
            moveAt(event.pageX, event.pageY);
        }
        document.addEventListener('mousemove', onMouseMove);
        movableDiv.onmouseup = function () {
            document.removeEventListener('mousemove', onMouseMove);
            movableDiv.onmouseup = null;
        };
    };
    movableDiv.ondragstart = function () {
        return false;
    };
</script>
