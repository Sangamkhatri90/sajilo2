<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Navigation</title>
    <style>
        /* Basic table styling */
        table {
            width: 50%;
            margin: 20px auto;
            border-collapse: collapse;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
        }

        /* Styling for the selected row */
        .table-nav tr.selected {
            background-color: #f0f0f0;
            outline: 1px solid #0078d4;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Table Navigation Example</h1>

    <!-- First Table -->
    <table class="table-nav">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>John Doe</td><td>28</td></tr>
            <tr><td>2</td><td>Jane Smith</td><td>34</td></tr>
            <tr><td>3</td><td>Emily Johnson</td><td>22</td></tr>
            <tr><td>4</td><td>Michael Brown</td><td>45</td></tr>
        </tbody>
    </table>

    <!-- Second Table -->
    <table class="table-nav">
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Apple</td><td>Fruits</td><td>$1</td></tr>
            <tr><td>Carrot</td><td>Vegetables</td><td>$0.5</td></tr>
            <tr><td>Milk</td><td>Dairy</td><td>$1.2</td></tr>
            <tr><td>Bread</td><td>Bakery</td><td>$2</td></tr>
        </tbody>
    </table>

    <!-- Third Table -->
    <table class="table-nav">
        <thead>
            <tr>
                <th>City</th>
                <th>Country</th>
                <th>Population</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>New York</td><td>USA</td><td>8,398,748</td></tr>
            <tr><td>Tokyo</td><td>Japan</td><td>13,515,271</td></tr>
            <tr><td>London</td><td>UK</td><td>8,982,000</td></tr>
            <tr><td>Sydney</td><td>Australia</td><td>5,312,163</td></tr>
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Function to handle table navigation
            function handleTableNavigation(table) {
                const rows = table.getElementsByTagName('tr');
                let selectedRowIndex = 1; // Initially select the first row (skip header)

                // Function to select a row
                function selectRow(index) {
                    if (index < 1 || index >= rows.length) return; // Ensure index is within valid bounds

                    // Remove selection from all rows
                    Array.from(rows).forEach(row => row.classList.remove('selected'));

                    // Add selection to the specified row
                    rows[index].classList.add('selected');
                    selectedRowIndex = index;

                    // Optionally scroll the selected row into view
                    rows[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }

                // Initially select the first row
                selectRow(selectedRowIndex);

                // Add click event listener for the table
                table.addEventListener('click', (event) => {
                    // Ensure table is focused on click
                    table.focus();

                    // Check if a row was clicked
                    const clickedRow = event.target.closest('tr');
                    if (clickedRow && Array.from(rows).includes(clickedRow)) {
                        selectedRowIndex = Array.from(rows).indexOf(clickedRow); // Update the selected row index
                        selectRow(selectedRowIndex);
                    }
                });

                // Handle keyboard navigation for the table
                table.addEventListener('keydown', (event) => {
                    if (event.key === 'ArrowDown') {
                        event.preventDefault(); // Prevent default scrolling
                        if (selectedRowIndex < rows.length - 1) {
                            selectRow(selectedRowIndex + 1); // Move to the next row
                        }
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault(); // Prevent default scrolling
                        if (selectedRowIndex > 1) {
                            selectRow(selectedRowIndex - 1); // Move to the previous row
                        }
                    }
                });
            }

            // Apply the navigation logic to all tables with the 'table-nav' class
            const tables = document.querySelectorAll('.table-nav');
            tables.forEach((table) => {
                // Ensure tables are focusable
                table.setAttribute('tabindex', '0');

                // Apply navigation logic
                handleTableNavigation(table);
            });
        });
    </script>
</body>
</html>
